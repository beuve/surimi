[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
version = "0.1.0"
description = "Simple test library fully written in python"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nicolas Beuve", email = "nicolas@beuve.net"}]
dependencies = ["click", "rich"]

[project.scripts]
hermes = "hermes.cli:test"

[tool.setuptools]
packages = ["hermes"]
package-dir = {hermes = "lib"}
